[[keyboard.bindings]]
key = "Return"
mods = "Control"
# action = "ToggleFullscreen"
action = "ToggleMaximized"

[font]
size = 11.0

[font.normal]
family = "FiraCode Nerd Font Mono"
style = "Regular"

[font.bold]
family = "FiraCode Nerd Font Mono"
style = "Bold"

[font.italic]
family = "FiraCode Nerd Font Mono"
style = "Regular" # у Nerd часто нет italic

[font.bold_italic]
family = "FiraCode Nerd Font Mono"
style = "Bold"
